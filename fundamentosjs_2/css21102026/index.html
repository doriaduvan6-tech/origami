<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- CDN React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- CDN Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <div id="root"></div>

    <script type="text/babel">
        //  esto es un hook // 
        const { useState, useEffect } = React;

        const Info = () => {
            const [data, setData] = useState([1]); // Datos que vienen del backend
            const [currentInfo, setCurrentInfo] = useState(1);

            useEffect(() => {
                fetch("http://localhost:3000/items")
                    .then((res) => res.json())
                    .then((res) => {
                        console.log(res.data);
                        setData(res.data);
                        if (res.data && res.data.length > 0) {
                            setCurrentInfo(res.data[0]);
                        } s
                    })
                    .catch((e) => console.log(e))
            }, [])


            return (
                <>
                    <h1>Mi mejor deseo</h1>
                    <img src={`img/${currentInfo}.jpg`} alt="info" />

                    {/* Opción 1: Tus botones manuales corregidos usando setCurrentInfo */}
                 

                    <div>
                        {data.map((item, index) => (
                            <button key={index} onClick={() => setCurrentInfo(item)}>
                                Push me {item}
                            </button>
                        ))}
                    </div>
                </>

            )
        }

        // Renderizar la aplicación en el DOM virtual
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Info />);
    </script>
</body>

</html>
